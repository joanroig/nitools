[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nitools"
version = "2.0.0"
description = "Native Instruments sample tools, kits and previews exporter."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "appdirs>=1.4.4",
  "colorlog>=6.12.0",
  "concurrent-log-handler>=0.9.29",
  "numpy>=2.5.1",
  "pydantic>=2.13.4",
  "soxr>=1.1.0",
  "PySide6-Essentials>=6.10.3,<6.11",
  "pyqtdarktheme-fork>=2.3.6",
  "soundfile>=0.14.0",
  "pedalboard>=0.9.26,<0.10; sys_platform == 'win32' or sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=12.2.2,<13; sys_platform == 'darwin'",
]

[dependency-groups]
build = [
  "pyinstaller>=6.21.0",
  "markdown-pdf>=1.13.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
python-preference = "only-system"
python-downloads = "never"
