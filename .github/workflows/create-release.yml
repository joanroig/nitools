name: Create Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Select the version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - none
          - patch
          - minor
          - major

# Prevent multiple release workflows in parallel
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      app_version: ${{ steps.set_version.outputs.APP_VERSION }}
      source_sha: ${{ steps.set_version.outputs.SOURCE_SHA }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Require completed publication review
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          review = json.loads(Path('packaging/release_review.json').read_text())
          if review.get('approved') is not True or review.get('pending'):
              raise SystemExit('Release review is incomplete: ' + '; '.join(review.get('pending', [])))
          PY

      - name: Install uv
        run: python -m pip install uv

      - name: Prepare version without publishing a tag
        id: set_version
        env:
          VERSION_BUMP: ${{ inputs.version_bump }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "::error::Run this workflow from a release branch, not a tag."
            exit 1
          fi
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          if [ "$VERSION_BUMP" != "none" ]; then
            # Bump version in pyproject.toml (the single source of truth)
            new_version=$(python scripts/bump_version.py --file pyproject.toml --bump "$VERSION_BUMP" --variable version)
            uv lock
            version=$new_version
          else
            # Use current version from file
            version=$(python -c "from src.utils.version import APP_VERSION; print(APP_VERSION)")
          fi

          if git rev-parse --verify "refs/tags/v$version" >/dev/null 2>&1; then
            echo "::error::Tag v$version already exists; release tags must never be overwritten."
            exit 1
          fi
          if [ "$VERSION_BUMP" != "none" ]; then
            git add pyproject.toml uv.lock
            git commit -m "Bump version to $version"
            git push origin "HEAD:$RELEASE_BRANCH"
          fi

          echo "APP_VERSION=$version" >> $GITHUB_OUTPUT
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  build:
    runs-on: ${{ matrix.runner_label }}
    needs: prepare_release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner_label: windows-latest
            python_arch: x64
            artifact_suffix: ""
            target_arch: "" # Not used for Windows
          - runner_label: macos-26-intel
            python_arch: x64
            artifact_suffix: "_x86_64"
            target_arch: x86_64
          - runner_label: macos-latest
            python_arch: arm64
            artifact_suffix: "_arm64"
            target_arch: arm64

    steps:
      - name: Checkout the exact release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare_release.outputs.source_sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python_arch }}

      - name: Install uv
        run: python -m pip install uv
        shell: bash

      - name: Install dependencies
        run: uv sync --locked --group build --python 3.13

      - name: Test before bundling
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --locked python -m unittest discover -s tests -v

      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg
        shell: bash

      - name: Bundle application (Windows)
        if: runner.os == 'Windows'
        run: ./bundle_app_windows.ps1 -CI
        shell: pwsh

      - name: Verify artifact exists (Windows)
        if: runner.os == 'Windows'
        run: |
          $file = "./dist/NITools_${{ runner.os }}_v${{ needs.prepare_release.outputs.app_version }}.zip"
          if (-Not (Test-Path $file)) {
            Write-Error "Expected artifact not found: $file"
            exit 1
          }
        shell: pwsh

      - name: Bundle application (macOS)
        if: runner.os == 'macOS'
        run: bash ./bundle_app_macos.sh ${{ matrix.target_arch }} --ci
        shell: bash

      - name: Verify artifact exists (macOS)
        if: runner.os == 'macOS'
        run: |
          file="./dist/NITools_macOS${{ matrix.artifact_suffix }}_v${{ needs.prepare_release.outputs.app_version }}.dmg"
          if [ ! -f "$file" ]; then
            echo "::error::Expected artifact not found: $file"
            exit 1
          fi
        shell: bash

      - name: Stage the tested package
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.runner_label }}
          if-no-files-found: error
          compression-level: 0
          path: |
            ${{ runner.os == 'Windows' && format('./dist/NITools_Windows_v{0}.zip', needs.prepare_release.outputs.app_version) || '' }}
            ${{ runner.os == 'macOS' && format('./dist/NITools_macOS{0}_v{1}.dmg', matrix.artifact_suffix, needs.prepare_release.outputs.app_version) || '' }}
  draft_release:
    needs: [prepare_release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare_release.outputs.source_sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Require all packages and calculate checksums
        working-directory: release
        env:
          VERSION: ${{ needs.prepare_release.outputs.app_version }}
        run: |
          test -s "NITools_Windows_v$VERSION.zip"
          test -s "NITools_macOS_x86_64_v$VERSION.dmg"
          test -s "NITools_macOS_arm64_v$VERSION.dmg"
          sha256sum *.zip *.dmg > SHA256SUMS.txt
      - name: Create a draft only after every build passes
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare_release.outputs.app_version }}
          target_commitish: ${{ needs.prepare_release.outputs.source_sha }}
          name: Release v${{ needs.prepare_release.outputs.app_version }}
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          body_path: docs/RELEASE_NOTES_2_0.md
          files: |
            release/*.zip
            release/*.dmg
            release/SHA256SUMS.txt
